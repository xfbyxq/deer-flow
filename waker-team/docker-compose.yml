services:
  waker-api:
    build: .
    ports:
      - "8000:8000"   # FastAPI
      - "8765:8765"   # MCP endpoint
    environment:
      - DEERFLOW_BASE_URL=${DEERFLOW_BASE_URL:-http://host.docker.internal:2026}
      - SERVICE_EMAIL=${SERVICE_EMAIL}
      - SERVICE_PASSWORD=${SERVICE_PASSWORD}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8765
      - DATABASE_URL=sqlite+aiosqlite:///./data/waker_team.db
      # CORS 可信来源白名单（CF10）。留空则使用代码内置默认白名单
      # （localhost/127.0.0.1 的 5173/4173/3000/2026）。覆盖时**必须是 JSON
      # 数组字符串**，禁止 "*"（与 allow_credentials=True 组合会开放带凭据跨域）。
      # 示例：CORS_ORIGINS='["https://team.example.com"]'
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # 唤醒投递护栏与同步瞬时错误预算（阈值 per-process，见 config.py）。
      - WAKE_MAX_CONCURRENCY=${WAKE_MAX_CONCURRENCY:-4}
      - WAKE_MAX_PER_MINUTE=${WAKE_MAX_PER_MINUTE:-30}
      - WAKE_THROTTLE_WAIT_TIMEOUT_SECONDS=${WAKE_THROTTLE_WAIT_TIMEOUT_SECONDS:-60.0}
      - SYNC_MAX_TRANSIENT_FAILURES=${SYNC_MAX_TRANSIENT_FAILURES:-30}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - waker-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://127.0.0.1:8000/api/health'); assert r.status_code == 200"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  waker-data:
